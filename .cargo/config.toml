# Cross-compiling to Windows with llvm-mingw (no Microsoft SDK needed).
# PATH and environment variables: scripts/build-windows.sh
[target.aarch64-pc-windows-gnullvm]
linker = "aarch64-w64-mingw32-clang"
# Link the llvm-mingw runtime (libunwind) into the exe: Windows has no libunwind.dll
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnullvm]
linker = "x86_64-w64-mingw32-clang"
# Link the llvm-mingw runtime (libunwind) into the exe: Windows has no libunwind.dll
rustflags = ["-C", "target-feature=+crt-static"]
