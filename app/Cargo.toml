[package]
name = "peekaboard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "peekaboard: ZMK and QMK keymap viewer with a live-layer HUD"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keymap-core = { path = "../crates/keymap-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"

# Raw HID: the live layer. One backend per OS, none of them needs system libraries.
[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2", default-features = false, features = ["macos-shared-device"] }
# The HUD as a non-activating NSPanel, like the Swift app's FloatingPanel
tauri-nspanel = "2.1"
# AppKit calls: the HUD's rounded corners, the menu bar icon
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2", default-features = false, features = ["linux-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
